<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ECEEFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14112B" media="(prefers-color-scheme: dark)">
<title>养一只</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  /* 一张贴纸本：浅紫蓝的点阵底，深靛的粗描边，硬投影。柠檬黄只给「现在该点的那个按钮」。 */
  --bg: #ECEEFF; --dot: #D9DCF7; --card: #FFFFFF; --ink: #1E1A3C; --ink-2: #5C5980; --soft: #D5D8F2; --edge: #1E1A3C; --drop: #1E1A3C;
  --pop: #FFD23F; --on-pop: #1E1A3C; --me: #DDF6EA; --hot: #E5325A; --ok: #1C9A68;
  --display: 'ZCOOL KuaiLe', 'Yuanti SC', 'YouYuan', 'PingFang SC', sans-serif;
  --body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  --spring: cubic-bezier(.2, 1.6, .4, 1);
  /* 布局：所有宽度都是一条手机宽的单栏。它住在顶上那张会吸顶的卡里，说话时卡片收矮让出地方。 */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14112B; --dot: #1D1A3A; --card: #211D42; --ink: #F3F0FF; --ink-2: #ABA7CF; --soft: #37325F; --edge: #F3F0FF; --drop: #000; --pop: #FFD23F; --on-pop: #1E1A3C; --me: #1E4A3B; --hot: #FF7A98; --ok: #5FD9A8; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14112B; --dot: #1D1A3A; --card: #211D42; --ink: #F3F0FF; --ink-2: #ABA7CF; --soft: #37325F; --edge: #F3F0FF; --drop: #000; --pop: #FFD23F; --on-pop: #1E1A3C; --me: #1E4A3B; --hot: #FF7A98; --ok: #5FD9A8; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg) radial-gradient(var(--dot) 1.5px, transparent 1.6px) 0 0 / 18px 18px; color: var(--ink); font: 400 16px/1.65 var(--body); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ol, ul, figure { margin: 0; padding: 0; } ol, ul { list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

.app { max-width: 480px; margin: 0 auto; padding: 0 16px 56px; }
.top { display: flex; align-items: center; gap: 4px; min-height: 54px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 400 1.5rem/1 var(--display); color: var(--ink); text-decoration: none; margin-right: auto; }
.brand svg { flex: none; transition: transform .3s var(--spring); } .brand:hover svg { transform: rotate(-12deg) scale(1.1); }
.navlink { background: none; border: 0; cursor: pointer; padding: 6px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-size: .95rem; font-weight: 500; transition: background .15s, color .15s; }
.navlink:hover, .navlink[aria-current="page"] { color: var(--ink); background: var(--card); }
.linkbtn { background: none; border: 0; padding: 8px 6px; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; font-size: .95rem; }
.linkbtn:hover { color: var(--ink); }
#view > * { animation: viewin .28s ease-out; }
@keyframes viewin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 18px; border: 2.5px solid var(--edge); border-radius: 14px; background: var(--card); cursor: pointer; font-weight: 500; line-height: 1.3; box-shadow: 3px 3px 0 var(--drop); transition: transform .09s, box-shadow .09s; }
.btn:hover:not(:disabled) { box-shadow: 5px 5px 0 var(--drop); filter: brightness(1.04); }   /* 悬停时不挪位置：按钮从光标底下挪开会来回抖 */
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--drop); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.btn.primary { background: var(--pop); color: var(--on-pop); border-color: #1E1A3C; }
.btn.cta { width: 100%; min-height: 58px; font: 400 1.35rem/1.2 var(--display); border-radius: 18px; box-shadow: 4px 4px 0 var(--drop); }
.btn.cta:hover:not(:disabled) { box-shadow: 6px 6px 0 var(--drop); }
.btn.cta:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--drop); }
.btn.hot { color: var(--hot); border-color: var(--hot); box-shadow: 3px 3px 0 var(--hot); }
.btn.small { min-height: 38px; padding: 4px 14px; font-size: .92rem; border-radius: 12px; box-shadow: 2px 2px 0 var(--drop); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sublinks { display: flex; justify-content: center; gap: 18px; margin-top: 6px; }
.note { color: var(--ink-2); font-size: .9rem; }
.err { color: var(--hot); font-size: .92rem; }

/* 舞台：它住的那张卡。里面是一小片场景，字的颜色跟着昼夜走 */
.stagewrap { position: sticky; top: 0; z-index: 5; padding: 6px 0 2px; margin: 0 -4px; padding-left: 4px; padding-right: 8px; background: linear-gradient(var(--bg) 82%, transparent); }
.stage { position: relative; height: 252px; color: #1E1A3C; border: 2.5px solid #1E1A3C; border-radius: 26px; box-shadow: 5px 5px 0 var(--drop); overflow: hidden; transition: height .35s var(--spring); background: #fff; }
.stage.night { color: #F6F3FF; }
.stage.compact { height: 150px; }
.stage .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .nameplate { position: absolute; left: 14px; right: 12px; top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 2; pointer-events: none; }
.nameplate h1 { font: 400 1.5rem/1.2 var(--display); overflow-wrap: anywhere; text-shadow: 0 2px 0 rgba(255, 255, 255, .5); }
.stage.night .nameplate h1 { text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.pill { font-size: .78rem; font-weight: 500; padding: 1px 10px; border: 2px solid #1E1A3C; border-radius: 99px; background: #fff; color: #1E1A3C; white-space: nowrap; }
.pill.sleep { background: #D9D7EE; }
.actor { position: absolute; left: 50%; bottom: 44px; width: 172px; transform: translateX(-50%); background: none; border: 0; padding: 0; cursor: pointer; z-index: 1; transition: width .35s var(--spring), bottom .35s var(--spring); touch-action: manipulation; }
.actor svg { display: block; width: 100%; height: auto; overflow: visible; }
.stage.compact .actor { width: 104px; bottom: 30px; }
.actor:focus-visible { outline-offset: 6px; border-radius: 20px; }
.quip { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); z-index: 3; background: #fff; color: #1E1A3C; border: 2.5px solid #1E1A3C; border-radius: 14px; padding: 2px 12px; font: 400 1rem/1.5 var(--display); white-space: nowrap; pointer-events: none; animation: quip 1.7s ease-out both; }
@keyframes quip { 0% { opacity: 0; transform: translate(-50%, 8px) scale(.8); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.growbar { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: .82rem; font-weight: 500; z-index: 2; color: #1E1A3C; }
.stage.night .growbar { color: #F6F3FF; }
.growbar .track { flex: 1; height: 14px; border: 2.5px solid #1E1A3C; border-radius: 99px; background: #fff; overflow: hidden; }
.growbar .track i { display: block; height: 100%; background: linear-gradient(#3B3570, #1E1A3C); border-radius: 99px; transition: width .7s var(--spring); }
.growbar.gain .track { animation: barglow .7s ease-out; }
@keyframes barglow { 0% { box-shadow: 0 0 0 0 var(--pop); } 40% { box-shadow: 0 0 0 5px var(--pop); } 100% { box-shadow: 0 0 0 0 transparent; } }
.stage.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flash .6s ease-out both; z-index: 4; pointer-events: none; }
@keyframes flash { 0% { opacity: 0; } 25% { opacity: .95; } 100% { opacity: 0; } }
.stage.mini { height: auto; aspect-ratio: 1; border-radius: 20px; box-shadow: 4px 4px 0 var(--drop); }
.stage.mini .actor { width: 64%; bottom: 14%; cursor: inherit; pointer-events: none; }
.stage.wide { height: 200px; } .stage.wide .actor { bottom: 28px; pointer-events: none; }

/* 它的身体：表情靠 data-mood 切换，不重绘 */
.critter .e-open, .critter .e-happy, .critter .e-sleep, .critter .m-smile, .critter .m-o, .critter .m-happy, .critter .m-flat, .critter .m-talk, .critter .zzz { display: none; }
.critter[data-mood="awake"] .e-open, .critter[data-mood="ask"] .e-open, .critter[data-mood="think"] .e-open, .critter[data-mood="happy"] .e-happy, .critter[data-mood="sleep"] .e-sleep,
.critter[data-mood="awake"] .m-smile, .critter[data-mood="ask"] .m-o, .critter[data-mood="happy"] .m-happy, .critter[data-mood="sleep"] .m-flat, .critter[data-mood="think"] .m-flat, .critter[data-mood="sleep"] .zzz { display: inline; }
.critter.talking[data-mood="awake"] .m-smile, .critter.talking[data-mood="ask"] .m-o { display: none; }
.critter.talking[data-mood="awake"] .m-talk, .critter.talking[data-mood="ask"] .m-talk { display: inline; transform-box: fill-box; transform-origin: center; animation: talk .17s ease-in-out infinite alternate; }
@keyframes talk { from { transform: scale(1, .25); } to { transform: scale(1, 1); } }
.critter[data-mood="sleep"] .cheeks { opacity: .45; }
.critter .pupil { transform: translate(calc(var(--px, 0) * 1px), calc(var(--py, 0) * 1px)); transition: transform .2s ease-out; }
.critter .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.08); } }
.critter .idle { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-4px) scale(.995, 1.012); } }
.critter[data-mood="sleep"] .idle { animation: breathe 4.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, .97); } }
.critter .p-tail { transform-box: fill-box; transform-origin: 10% 90%; animation: wag 1.1s ease-in-out infinite alternate; }
@keyframes wag { from { transform: rotate(-7deg); } to { transform: rotate(9deg); } }
.critter .p-wing { transform-box: fill-box; transform-origin: 95% 45%; animation: flap 1.9s ease-in-out infinite alternate; }
@keyframes flap { from { transform: rotate(-5deg); } to { transform: rotate(10deg) scale(1.04); } }
.critter .p-ant { transform-box: fill-box; transform-origin: 90% 100%; animation: sway 2.6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
.critter[data-mood="sleep"] .p-tail, .critter[data-mood="sleep"] .p-wing, .critter[data-mood="sleep"] .p-ant { animation-play-state: paused; }
.critter .zzz text { animation: zzz 2.6s ease-in-out infinite; } .critter .zzz text:last-child { animation-delay: .9s; }
@keyframes zzz { 0%, 100% { opacity: .15; translate: 0 4px; } 50% { opacity: 1; translate: 0 -3px; } }
.critter .act { transform-box: fill-box; transform-origin: 50% 100%; }
.critter.poke .act { animation: poke .45s var(--spring); }
@keyframes poke { 0% { transform: scale(1, 1); } 30% { transform: scale(1.14, .82); } 60% { transform: scale(.94, 1.08); } 100% { transform: scale(1, 1); } }
.critter.gulp .act { animation: gulp .55s ease-out; }
@keyframes gulp { 0% { transform: scale(1, 1); } 25% { transform: scale(.9, 1.12); } 55% { transform: scale(1.16, .88); } 100% { transform: scale(1, 1); } }
.critter.jump .act { animation: jump .75s ease-out; }
@keyframes jump { 0% { transform: translateY(0) scale(1.1, .86); } 30% { transform: translateY(-34px) scale(.94, 1.08); } 55% { transform: translateY(0) scale(1.12, .86); } 75% { transform: translateY(-10px) scale(.98, 1.03); } 100% { transform: translateY(0) scale(1, 1); } }
.critter.shakey .act { animation: shakey .11s linear infinite; }
@keyframes shakey { 0%, 100% { transform: translateX(-3px) rotate(-2.5deg); } 50% { transform: translateX(3px) rotate(2.5deg); } }
.critter.popin .act { animation: popin .6s var(--spring) both; }
@keyframes popin { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.critter .newpart { transform-box: fill-box; transform-origin: center; animation: partpop .8s var(--spring) .35s both; }
@keyframes partpop { from { transform: scale(0); } to { transform: scale(1); } }
.eggsvg .eggbody { transform-box: fill-box; transform-origin: 50% 100%; animation: wobble 2.6s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.eggsvg.hit .eggbody { animation: hit .32s ease-out; }
@keyframes hit { 0% { transform: rotate(0) scale(1); } 20% { transform: rotate(-9deg) scale(1.06, .94); } 50% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } 100% { transform: rotate(0); } }
.scene .star { animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.scene .cloud path { animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { translate: -16px 0; } to { translate: 22px 0; } }
.scene .dropin { animation: dropin .7s var(--spring) both; }
@keyframes dropin { from { translate: 0 -60px; opacity: 0; } to { translate: 0 0; opacity: 1; } }

/* 引导 */
.ob { display: grid; gap: 16px; padding-top: 4px; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 22px; height: 6px; border-radius: 99px; background: var(--soft); transition: background .3s; } .dots i.on { background: var(--edge); }
.ob h1 { font: 400 clamp(1.8rem, 8vw, 2.3rem)/1.25 var(--display); text-wrap: balance; }
.ob .lead { color: var(--ink-2); margin-top: -8px; }
.eggstage { height: 236px; } .eggstage .actor { width: 150px; bottom: 26px; }
.eggstage.big { height: 320px; } .eggstage.big .actor { width: 200px; bottom: 44px; }
.taphint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font: 400 1rem/1.4 var(--display); color: #1E1A3C; animation: pulse 1.2s ease-in-out infinite alternate; z-index: 2; pointer-events: none; }
.stage.night .taphint { color: #F6F3FF; }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
.field { display: grid; gap: 8px; }
.field label, .field .lab { font: 400 1.2rem/1.3 var(--display); }
.field .hint { font-size: .86rem; color: var(--ink-2); }
input[type="text"], textarea { width: 100%; min-height: 50px; background: var(--card); border: 2.5px solid var(--edge); border-radius: 14px; padding: 10px 14px; transition: box-shadow .15s; }
input[type="text"]:focus { outline: none; box-shadow: 0 0 0 4px var(--pop); }
input::placeholder, textarea::placeholder { color: var(--ink-2); opacity: .75; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--edge); background: var(--card); border-radius: 99px; padding: 5px 14px; cursor: pointer; font-size: .92rem; min-height: 38px; text-align: left; transition: background .12s, transform .09s; }
.chip:hover, .chip[aria-pressed="true"] { background: var(--pop); color: var(--on-pop); border-color: #1E1A3C; }
.chip:active { transform: scale(.95); }
.levels { display: grid; gap: 10px; }
.level { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; padding: 10px 14px 10px 10px; background: var(--card); border: 2.5px solid var(--edge); border-radius: 16px; animation: rise .35s var(--spring) both; }
.level:nth-child(2) { animation-delay: .07s; } .level:nth-child(3) { animation-delay: .14s; } .level:nth-child(4) { animation-delay: .21s; } .level:nth-child(5) { animation-delay: .28s; }
.level .i { width: 32px; height: 32px; border-radius: 50%; background: var(--edge); color: var(--bg); display: grid; place-items: center; font: 400 1.05rem/1 var(--display); }
.level .nm { font: 400 1.15rem/1.35 var(--display); overflow-wrap: anywhere; }
.level .dw { color: var(--ink-2); font-size: .86rem; overflow-wrap: anywhere; }
.level .two { display: grid; gap: 6px; } .level .two input { min-height: 42px; padding: 6px 10px; } .level .two input:last-child { font-size: .88rem; }
.namerow { display: flex; gap: 10px; align-items: center; } .namerow input { flex: 1; min-width: 0; }

/* 对话 */
.thread { display: grid; gap: 10px; margin-top: 14px; }
.msg { position: relative; max-width: 90%; padding: 10px 14px; border: 2.5px solid var(--edge); border-radius: 18px; overflow-wrap: anywhere; white-space: pre-line; }
.msg.pet { justify-self: start; background: var(--card); box-shadow: 3px 3px 0 var(--drop); }
.msg.pet.lead { border-top-left-radius: 6px; }
.msg.pet.lead::before { content: ""; position: absolute; left: 20px; top: -12px; width: 18px; height: 12px; background: var(--edge); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.msg.pet.lead::after { content: ""; position: absolute; left: 23.5px; top: -6.5px; width: 11px; height: 8px; background: var(--card); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
.msg.me { justify-self: end; background: var(--me); border-bottom-right-radius: 6px; }
.msg .rest { visibility: hidden; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.msg.new, .sys.new { animation: rise .3s var(--spring) both; }
@keyframes rise { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.msg.thinking { display: flex; gap: 6px; padding: 14px 16px; }
.msg.thinking i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); animation: think 1s ease-in-out infinite; } .msg.thinking i:nth-child(2) { animation-delay: .15s; } .msg.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes think { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }
.sys { justify-self: center; text-align: center; font-size: .86rem; color: var(--ink-2); padding: 0 12px; max-width: 100%; overflow-wrap: anywhere; }
.sys b { color: var(--ok); font-weight: 500; }
.nextnote { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 6px 10px 14px; border: 2.5px dashed var(--edge); border-radius: 16px; background: color-mix(in srgb, var(--card) 55%, transparent); }
.nextnote .k { font-size: .78rem; font-weight: 500; color: var(--ink-2); }
.nextnote .v { font: 400 1.15rem/1.4 var(--display); overflow-wrap: anywhere; } .nextnote .v.empty { color: var(--ink-2); }
.nextnote > div { flex: 1; min-width: 0; }
.composer { margin-top: 16px; display: grid; gap: 10px; }
.inrow { display: flex; gap: 8px; align-items: stretch; } .inrow input { flex: 1; min-width: 0; } .inrow .btn { flex: none; }
.composer .hint { font-size: .85rem; color: var(--ink-2); text-align: center; }

/* 两行「可以不看」的入口 */
.rows { margin-top: 26px; display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; background: var(--card); border: 2px solid var(--soft); border-radius: 16px; cursor: pointer; transition: border-color .15s, transform .09s; }
.row:hover { border-color: var(--edge); } .row:active { transform: scale(.985); }
.row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; } .row .c { color: var(--ink-2); font-size: .9rem; white-space: nowrap; } .row .c::after { content: " ›"; }
.row .ic { display: flex; } .row .ic .glyph { margin-left: -8px; } .row .ic .glyph:first-child { margin-left: 0; }

/* 弹层 */
.sheet-wrap { position: fixed; inset: 0; background: rgba(20, 17, 43, .6); display: grid; align-items: end; justify-items: center; z-index: 10; overflow-y: auto; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { position: relative; width: 100%; max-width: 480px; background: var(--bg); border-top: 2.5px solid var(--edge); border-radius: 26px 26px 0 0; padding: 26px 18px 26px; display: grid; gap: 14px; max-height: 100%; overflow-y: auto; animation: sheetup .34s var(--spring); }
.sheet::before { content: ""; position: absolute; left: 50%; top: 9px; width: 44px; height: 5px; margin-left: -22px; border-radius: 99px; background: var(--soft); }
@keyframes sheetup { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (min-width: 640px) { .sheet-wrap { align-items: center; padding: 24px; } .sheet { border: 2.5px solid var(--edge); border-radius: 26px; box-shadow: 6px 6px 0 var(--drop); padding: 26px 24px 24px; } .sheet::before { display: none; } }
.sheet h2 { font: 400 1.6rem/1.3 var(--display); text-wrap: balance; }
.sheet p { overflow-wrap: anywhere; }
.sheet section { display: grid; gap: 8px; } .sheet section + section { border-top: 2px solid var(--soft); padding-top: 12px; }
.sheet .lab { font-size: .85rem; font-weight: 500; color: var(--ink-2); }
.eyebrow { font-size: .85rem; font-weight: 500; color: var(--ink-2); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--edge); color: var(--bg); padding: 10px 18px; border-radius: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; text-align: center; }
#toast.on { opacity: 1; }

/* 路线：一条往上走的小路 */
.trail { display: grid; }
.trail li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 0 12px; position: relative; padding-bottom: 16px; }
.trail li::before { content: ""; position: absolute; left: 23px; top: 46px; bottom: 0; border-left: 3px dashed var(--soft); }
.trail li:last-child::before { display: none; } .trail li:last-child { padding-bottom: 0; }
.trail .node { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid var(--edge); background: var(--card); font: 400 1.15rem/1 var(--display); overflow: hidden; }
.trail .todo .node { border-style: dashed; border-color: var(--ink-2); color: var(--ink-2); background: transparent; }
.trail .cur .node { box-shadow: 3px 3px 0 var(--drop); } .trail .cur .node svg { width: 40px; height: auto; margin-top: 4px; }
.trail .nm { font: 400 1.15rem/1.4 var(--display); overflow-wrap: anywhere; padding-top: 8px; } .trail .todo .nm { color: var(--ink-2); }
.trail .dw { color: var(--ink-2); font-size: .86rem; overflow-wrap: anywhere; }
.trail .shell { margin-top: 6px; font-size: .9rem; padding: 8px 12px; border: 2px dashed var(--soft); border-radius: 12px; white-space: pre-line; overflow-wrap: anywhere; }
.trail .tagnow { display: inline-block; font: 500 .72rem/1.6 var(--body); padding: 0 8px; margin-left: 6px; border-radius: 99px; background: var(--pop); color: var(--on-pop); vertical-align: 3px; }

/* 宝贝：一格一格的收藏 */
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { display: grid; justify-items: center; gap: 2px; padding: 10px 4px 8px; border: 2px solid var(--edge); border-radius: 16px; background: var(--card); text-align: center; font-size: .72rem; line-height: 1.35; }
.slot.new { background: var(--pop); color: var(--on-pop); border-color: #1E1A3C; animation: rise .4s var(--spring) both; }
.slot.none { border-style: dashed; border-color: var(--soft); background: transparent; color: var(--ink-2); font: 400 1.3rem/1 var(--display); min-height: 76px; place-content: center; }

/* 成长证书 */
.cert { border: 2.5px solid var(--edge); border-radius: 22px; background: var(--card); padding: 12px; display: grid; gap: 10px; box-shadow: 4px 4px 0 var(--drop); }
.cert .who { font: 400 1.5rem/1.3 var(--display); } .cert .what { overflow-wrap: anywhere; }
.cert .facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: .82rem; padding: 2px 10px; border-radius: 99px; background: var(--bg); border: 2px solid var(--soft); }

/* 日记、栖地 */
.page { display: grid; gap: 16px; }
.page h1 { font: 400 2rem/1.3 var(--display); }
.page h2 { font: 400 1.3rem/1.35 var(--display); overflow-wrap: anywhere; }
.stagehead { font: 400 1.05rem/1.4 var(--display); padding: 6px 0; border-bottom: 2.5px solid var(--edge); margin-top: 10px; }
.log { padding: 12px 0; border-bottom: 2px solid var(--soft); display: grid; gap: 4px; }
.log .when { color: var(--ink-2); font-size: .82rem; }
.log .tx { overflow-wrap: anywhere; white-space: pre-line; }
.log .qa { padding-left: 10px; border-left: 3px solid var(--soft); font-size: .92rem; overflow-wrap: anywhere; } .log .qa .qq { color: var(--ink-2); }
.log .nx { font-size: .88rem; color: var(--ink-2); overflow-wrap: anywhere; }
.shellcard { padding: 10px 14px; margin: 10px 0 0; border: 2.5px dashed var(--edge); border-radius: 16px; background: color-mix(in srgb, var(--card) 55%, transparent); }
.shellcard .k { font-size: .82rem; font-weight: 500; color: var(--ink-2); } .shellcard p { white-space: pre-line; overflow-wrap: anywhere; }
.bondbig { font: 400 1.8rem/1.2 var(--display); }
.homes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
.home { display: grid; gap: 6px; align-content: start; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; transition: transform .12s; }
.home:hover .stage { box-shadow: 6px 6px 0 var(--drop); } .home:active { transform: scale(.97); }
.home .nm { font: 400 1.15rem/1.3 var(--display); } .home .d { color: var(--ink-2); font-size: .82rem; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: .74rem; font-weight: 500; padding: 0 8px; border: 2px solid currentColor; border-radius: 99px; margin-right: 6px; vertical-align: 2px; }
.tag.grown { color: var(--ok); } .tag.released { color: var(--ink-2); } .tag.now { color: var(--hot); }
.switch { display: inline-flex; border: 2.5px solid var(--edge); border-radius: 99px; overflow: hidden; }
.switch button { border: 0; background: var(--card); padding: 4px 16px; cursor: pointer; font-weight: 500; } .switch button[aria-pressed="true"] { background: var(--edge); color: var(--bg); }

    <nav id="nav" aria-label="主导航"></nav>

<div id="sheet" class="sheet-wrap" hidden></div>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* 养一只 · 规则引擎
 * 纯函数：不碰界面，不读时钟，时间都由调用方传入 now（毫秒）。
 * 它长大的唯一来源是「见闻」，见闻只能靠讲述真实做过的事得到。聊天不长个儿。
 * 它不会饿、不会病、不会死：你不来，它只是睡了。
 */
(function (root) {
  'use strict';
  const DAY = 86400e3, HOUR = 3600e3;
  const DEFAULT = {
    // 见闻：大头给「留下东西」（回答它的问题、和它约好下一步），不给自报的时长
    xp: { s: 2, m: 2, l: 2, answer: 2, promise: 2 },   // 讲一次固定 2 点；s/m/l 只用来决定它长出什么，不再让用户自己报
    sameDay: [1, 0.5],                         // 同一天第 2 次减半，第 3 次起固定 1 点
    startXp: 3,                                // 孵出来并约好第一步，本身就是一次推进
    // 攒的话：离开越久，回来第一次讲述的见闻越多，但永远比不上天天来
    litter: { free: 1, k: 0.5, capDays: 30 },
    // 每一段内的等级：升一级要 4、6、8…点见闻，最高 7 级
    levelBase: 4, levelStep: 2, maxLevel: 7, overflowHours: 6,
    // 好奇心：它醒着的时候自己攒，攒够了就出门捡一样东西回窝
    rateBase: 2, rateLevel: 3, stageMul: 1.5, bondBonus: 0.05, trinketBonus: 0.1,
    trinketCost: 40, trinketGrow: 1.6,
    // 醒着：约好了下一步能醒 3 天，没约只醒一半
    awakeDays: 3, noPromise: 0.5,
    freshDays: 2, freshMul: 2,                 // 刚蜕完壳的两天，好奇心翻倍
    bondDiv: 200,                              // 蜕变得到的羁绊 = √(这一段的好奇心 / 200)
    patchGap: 5,                               // 隔了 5 天以上又回来：它身上多一块补丁（奖章，不是污点）
    parts: ['eyes', 'horns', 'wings', 'antenna', 'tail', 'plates'],
  };
  let CFG = JSON.parse(JSON.stringify(DEFAULT));
  function configure(over) { CFG = JSON.parse(JSON.stringify(DEFAULT)); if (over) Object.assign(CFG, over); return CFG; }

  function create() { return { v: 2, rev: 0, savedAt: 0, lang: 'zh', offset: 0, bond: 0, goal: null, logs: [], habitat: [] }; }
  const blankStat = () => ({ s: 0, m: 0, l: 0, ans: 0 });

  function newGoal(s, now, o) {
    const g = {
      id: 'g' + now.toString(36), title: o.title, why: o.why || '', kind: o.kind || 'make', style: o.style || 'curious', name: o.name,
      hue: o.hue | 0, shape: o.shape | 0, createdAt: now,
      miles: o.miles.map(m => ({ name: m.name, doneWhen: m.doneWhen || '', doneAt: 0, card: null })), cur: 0,
      promise: { text: o.promise || '', at: o.promise ? now : 0 },
      xp: CFG.startXp, n: 0, earned: 0, life: 0, trinkets: 0, unseen: 0, parts: [], patches: 0, stat: blankStat(),
      lastTick: now, awakeUntil: now + CFG.awakeDays * DAY * (o.promise ? 1 : CFG.noPromise), freshUntil: 0, lastAdvAt: 0, stageAdv: 0, adv: 0, welcome: null,
    };
    s.goal = g; return g;
  }

  /* 等级：由这一段攒下的见闻推出来 */
  function levelInfo(xp) {
    let lv = 0, left = xp, need = CFG.levelBase;
    while (lv < CFG.maxLevel && left >= need) { left -= need; lv++; need = CFG.levelBase + CFG.levelStep * lv; }
    return { level: lv, into: lv >= CFG.maxLevel ? 0 : left, need: lv >= CFG.maxLevel ? 0 : need, max: lv >= CFG.maxLevel };
  }
  const levelOf = g => levelInfo(g.xp).level;
  const baseRate = s => { const g = s.goal; return (CFG.rateBase + CFG.rateLevel * levelOf(g)) * Math.pow(CFG.stageMul, g.cur) * (1 + CFG.bondBonus * s.bond) * (1 + CFG.trinketBonus * g.trinkets); };
  const isAwake = (g, now) => now < g.awakeUntil;
  const isFresh = (g, now) => now < g.freshUntil;
  const rate = (s, now) => isAwake(s.goal, now) ? baseRate(s) * (isFresh(s.goal, now) ? CFG.freshMul : 1) : 0;
  const trinketCost = g => CFG.trinketCost * Math.pow(CFG.trinketGrow, g.trinkets);

  /* 把 lastTick 到 now 之间它自己攒的好奇心结算掉，顺便算它出门捡了几样东西 */
  function tick(s, now) {
    const g = s.goal; if (!g || now <= g.lastTick) return 0;
    let t = g.lastTick, found = 0; const end = Math.min(now, g.awakeUntil);
    for (let guard = 0; t < end && guard < 400; guard++) {
      const fresh = t < g.freshUntil, segEnd = fresh ? Math.min(end, g.freshUntil) : end;
      const r = baseRate(s) * (fresh ? CFG.freshMul : 1) / HOUR, need = trinketCost(g) - g.n;
      if (need <= 0) { g.n -= trinketCost(g); g.trinkets++; found++; continue; }
      const dt = need / r;
      if (t + dt <= segEnd) { g.n += need; g.earned += need; g.life += need; t += dt; }
      else { const gain = (segEnd - t) * r; g.n += gain; g.earned += gain; g.life += gain; t = segEnd; }
    }
    while (g.n >= trinketCost(g)) { g.n -= trinketCost(g); g.trinkets++; found++; }
    g.unseen += found; g.lastTick = now; return found;
  }

  const dayKey = (ms, tz) => Math.floor((ms - (tz || 0) * 60e3) / DAY);
  const gapDays = (g, now) => g.lastAdvAt ? Math.max(0, (now - g.lastAdvAt) / DAY) : 0;
  function litterMul(s, now) { const L = CFG.litter, d = Math.min(gapDays(s.goal, now), L.capDays); return 1 + L.k * Math.sqrt(Math.max(0, d - L.free)); }
  function sameDayFactor(s, now, tz) {
    const g = s.goal, k = dayKey(now, tz), c = s.logs.filter(l => l.goalId === g.id && dayKey(l.at, tz) === k).length;
    return c < CFG.sameDay.length ? CFG.sameDay[c] : 0;
  }
  const scaled = (base, f, mult) => f === 0 ? 1 : Math.max(1, Math.round(base * f * mult));
  function preview(s, now, size, tz) { const mult = litterMul(s, now), f = sameDayFactor(s, now, tz); return { xp: scaled(CFG.xp[size], f, mult), mult, factor: f, gap: gapDays(s.goal, now) }; }

  function addXp(s, n) {
    const g = s.goal, a = levelInfo(g.xp);
    if (a.max) { g.n += n * CFG.overflowHours * baseRate(s); return false; }   // 满级后，见闻直接变成好奇心
    g.xp += n; return levelOf(g) > a.level;
  }
  /* 讲述：告诉它这次做了什么 */
  function report(s, now, { text, size, tz }) {
    const g = s.goal; tick(s, now);
    const p = preview(s, now, size, tz), patched = !!g.lastAdvAt && p.gap >= CFG.patchGap && g.patches < 2;
    if (patched) g.patches++;
    const up = addXp(s, p.xp);
    g.lastAdvAt = now; g.stageAdv++; g.adv++; g.stat[size]++; g.welcome = null;
    g.awakeUntil = Math.max(g.awakeUntil, now + CFG.awakeDays * CFG.noPromise * DAY);
    const log = { id: 'l' + now.toString(36) + g.adv, goalId: g.id, stage: g.cur, at: now, text, size, reply: '', q: '', a: '', next: '', xp: p.xp, mult: p.mult, factor: p.factor, gap: p.gap, patched };
    s.logs.push(log); return { log, up };
  }
  /* 回答它问的那一句 */
  function answer(s, now, logId, q, a) {
    const log = s.logs.find(l => l.id === logId); if (!log || log.a) return { xp: 0, up: false };
    const add = scaled(CFG.xp.answer, log.factor, log.mult); log.q = q; log.a = a; log.xp += add; s.goal.stat.ans++;
    return { xp: add, up: addXp(s, add) };
  }
  /* 约定下一步。跟在一次讲述后面的约定才有见闻；单独改约定只会让它醒足 3 天 */
  function promise(s, now, text, logId) {
    const g = s.goal; tick(s, now); text = text.trim(); g.promise = { text, at: now }; g.welcome = null;
    let add = 0, up = false; const log = logId && s.logs.find(l => l.id === logId);
    if (text && log && !log.next) { add = scaled(CFG.xp.promise, log.factor, log.mult); log.next = text; log.xp += add; up = addXp(s, add); }
    if (text && g.lastAdvAt) g.awakeUntil = Math.max(g.awakeUntil, g.lastAdvAt + CFG.awakeDays * DAY);
    return { xp: add, up };
  }

  const bondGain = g => g.stageAdv > 0 ? Math.max(1, Math.floor(Math.sqrt(g.earned / CFG.bondDiv))) : 0;
  /* 这一段你是怎么做的，决定它长出什么 */
  function pickPart(g) {
    const st = g.stat, n = Math.max(1, st.s + st.m + st.l);
    const score = { eyes: st.ans / n * 1.2, horns: st.l / n, wings: st.s / n, antenna: st.m / n * 0.9, tail: 0.3, plates: 0.25 };
    return CFG.parts.filter(p => !g.parts.includes(p)).sort((a, b) => score[b] - score[a])[0] || null;
  }
  const lookOf = g => ({ name: g.name, shape: g.shape, hue: g.hue, kind: g.kind, stage: g.cur, level: levelOf(g), parts: g.parts.slice(), patches: g.patches });
  function settle(s, now, result, extra) {
    const g = s.goal;
    s.habitat.push(Object.assign({ id: g.id, title: g.title, look: lookOf(g), createdAt: g.createdAt, endedAt: now, result, adv: g.adv, trinkets: g.trinkets,
      miles: g.miles.map(m => ({ name: m.name, doneAt: m.doneAt, card: m.card })) }, extra || {}));
    s.goal = null;
  }
  /* 这一段做完了：蜕变。返回 {bond, part, done} */
  function molt(s, now, card) {
    const g = s.goal; tick(s, now); const bond = bondGain(g), part = pickPart(g);
    s.bond += bond; if (part) g.parts.push(part);
    const m = g.miles[g.cur]; m.doneAt = now; m.card = Object.assign({ bond, part, adv: g.stageAdv }, card || {});
    g.cur++; g.welcome = null;
    const done = g.cur >= g.miles.length;
    if (done) { g.xp = 0; settle(s, now, 'grown'); }
    else { g.xp = 0; g.earned = 0; g.stageAdv = 0; g.stat = blankStat(); g.freshUntil = now + CFG.freshDays * DAY; g.lastTick = now; }
    return { bond, part, done };
  }
  /* 体面地放下：放归野外，羁绊照拿 */
  function release(s, now, reason) { const g = s.goal; tick(s, now); const bond = bondGain(g); s.bond += bond; settle(s, now, 'released', { reason: reason || '' }); return { bond }; }

  const api = { DAY, HOUR, get CFG() { return CFG; }, configure, create, newGoal, levelInfo, levelOf, baseRate, rate, isAwake, isFresh, trinketCost, tick,
    dayKey, gapDays, litterMul, sameDayFactor, preview, report, answer, promise, bondGain, pickPart, lookOf, molt, release };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Pet = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 养一只 · 形象、场景、宝贝
 * 全部是 SVG，不用任何图片。
 * 伙伴 = 体型 × 颜色 × 长出的部位 × 补丁 × 等级斑点。每种表情都画在同一张 SVG 里，
 * 换表情只改根节点的 data-mood，不重绘；眼珠的位置由两个 CSS 变量控制，所以它能看着你。
 * 所有会动的部位都用 transform-box: fill-box 定轴，不依赖画布坐标。
 */
(function (root) {
  'use strict';
  const INK = '#1E1A3C';
  // [身体, 肚皮/浅色, 深色, 白天的天色]
  const HUES = [
    ['#FF7B5A', '#FFD8CA', '#D9532F', '#FFE9B0'], ['#4FD1A1', '#D2F6E7', '#249C72', '#FFDDE9'], ['#5AB0FF', '#D6EBFF', '#2B7FD1', '#FFF0A8'],
    ['#FFCF3A', '#FFF2C2', '#D99E00', '#D5E6FF'], ['#A98BFF', '#E7DEFF', '#7654E0', '#D2F5E1'], ['#FF85B8', '#FFDBEA', '#E0508C', '#D5EEFF'],
  ];
  const SHAPES = [
    { d: 'M120,74 C164,74 192,104 192,142 C192,182 162,208 120,208 C78,208 48,182 48,142 C48,104 76,74 120,74Z', top: 74, eye: 132, xl: 48, xr: 192, sy: 146 },
    { d: 'M120,52 C156,52 176,82 176,120 L176,160 C176,192 152,210 120,210 C88,210 64,192 64,160 L64,120 C64,82 84,52 120,52Z', top: 52, eye: 112, xl: 64, xr: 176, sy: 142 },
    { d: 'M120,66 C150,66 166,96 176,134 C188,178 164,210 120,210 C76,210 52,178 64,134 C74,96 90,66 120,66Z', top: 66, eye: 124, xl: 60, xr: 180, sy: 158 },
    { d: 'M88,70 L152,70 C176,70 188,84 188,108 L188,172 C188,196 174,210 150,210 L90,210 C66,210 52,196 52,172 L52,108 C52,84 64,70 88,70Z', top: 70, eye: 124, xl: 52, xr: 188, sy: 146 },
  ];
  const S = 'stroke="' + INK + '" stroke-linejoin="round" stroke-linecap="round"';
  const flip = s => '<g transform="translate(240,0) scale(-1,1)">' + s + '</g>';
  let uid = 0;

  function critter(look, mood, opt) {
    opt = opt || {};
    const sh = SHAPES[look.shape % SHAPES.length], [body, light, dark] = HUES[look.hue % HUES.length], has = p => look.parts.indexOf(p) >= 0;
    const big = has('eyes'), ey = sh.eye, r = big ? 17 : 12, my = ey + (big ? 26 : 22), id = 'dc' + (++uid);
    const sc = Math.min(1, 0.72 + look.stage * 0.06 + look.level * 0.015), fresh = opt.fresh || '';
    const np = p => p === fresh ? ' newpart' : '';
    let o = '';
    if (has('tail')) o += `<g class="p-tail${np('tail')}"><path d="M${sh.xr - 14},192 C${sh.xr + 34},200 ${sh.xr + 42},162 ${sh.xr + 22},150" fill="none" ${S} stroke-width="17"/><path d="M${sh.xr - 14},192 C${sh.xr + 34},200 ${sh.xr + 42},162 ${sh.xr + 22},150" fill="none" stroke="${body}" stroke-width="8" stroke-linecap="round"/><circle cx="${sh.xr + 21}" cy="148" r="10" fill="${dark}" ${S} stroke-width="5"/></g>`;
    if (has('wings')) { const w = `<g class="p-wing${np('wings')}"><path d="M${sh.xl + 12},${sh.sy - 12} C${sh.xl - 40},${sh.sy - 54} ${sh.xl - 54},${sh.sy + 4} ${sh.xl - 24},${sh.sy + 16} C${sh.xl - 34},${sh.sy + 36} ${sh.xl - 4},${sh.sy + 36} ${sh.xl + 12},${sh.sy + 14}Z" fill="${light}" ${S} stroke-width="5"/></g>`; o += w + flip(w); }

(function () {

  const Store = {

  const local = Store.loadLocal(); if (local && local.v === 2) { adopt(local); Store.kind = 'local'; }
  else { try { localStorage.setItem(KEY + '.t', '1'); localStorage.removeItem(KEY + '.t'); Store.kind = 'local'; } catch (e) { Store.kind = 'none'; } }
  ui.looking = !local && !!(window.claude && window.claude.use);
  render();
  if (ui.looking) setTimeout(() => { if (ui.looking) { ui.looking = false; if (!S.goal && !sheetOpen()) render(); } }, 4000);
  Store.connect().then(remote => {
    const was = ui.looking; ui.looking = false;
    if (remote && remote.v === 2 && (remote.savedAt || 0) > (S.savedAt || 0)) { adopt(remote); Store.saveLocal(); ui.draft = null; ui.thread = []; ui.from = 0; ui.step = 'idle'; ui.greetedFor = ''; closeSheet(); render(); }
    else { if (Store.ref && S.rev > 0) { Store.pending = true; Store.flush(); } if (was && !S.goal) render(); }
  });
