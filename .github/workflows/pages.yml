name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: |
          python3 src/build.py
          printf '{"webApiBasePath":"","nativeApiBaseUrl":""}\n' > dist/cloud-config.json
          printf 'ok\n' > dist/healthz
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check deployed site
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            https://ciki-9876.github.io/yangyizhi/healthz | grep -qx ok
