name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: python3 src/build.py
      - name: Restore the existing signed update feed
        run: node scripts/fetch-update-feed.mjs --url https://ciki-9876.github.io/yangyizhi/updates/stable.json --out artifacts/previous-updates
      - name: Assemble Pages files
        id: assemble
        run: |
          if [ -f artifacts/previous-updates/stable.json ]; then
            node scripts/prepare-deploy.mjs --web dist --updates artifacts/previous-updates --out artifacts/pages-release
            mkdir -p artifacts/pages-release/site/updates
            cp -R artifacts/pages-release/updates/. artifacts/pages-release/site/updates/
            echo "path=artifacts/pages-release/site" >> "$GITHUB_OUTPUT"
          else
            printf 'ok\n' > dist/healthz
            echo "path=dist" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.assemble.outputs.path }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check deployed site
        run: |
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            https://ciki-9876.github.io/yangyizhi/healthz | grep -qx ok
